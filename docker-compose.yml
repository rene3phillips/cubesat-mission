services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    env_file:
      - ./.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./dashboard:/app/dashboard

  db:
    image: postgres:15
    env_file:
      - ./.env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # persistent DB storage

  dashboard:
    build: ./dashboard
    ports:
      - "3001:3000"
    depends_on:
      - backend
    volumes:
      - ./dashboard:/app       # keeps live changes in dashboard

volumes:
  pgdata:

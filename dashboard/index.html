<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CubeSat Telemetry Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>CubeSat Telemetry Dashboard</h1>
    <div class="reading">
        <span id="telemetry">Loading...</span>
    </div>



    
    <!-- Starfield -->
    <script>
        const starCount = 100; // number of stars
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.top = Math.random() * window.innerHeight + 'px';
            star.style.left = Math.random() * window.innerWidth + 'px';
            star.style.animationDuration = (5 + Math.random() * 10) + 's'; // random speed
            star.style.width = star.style.height = (1 + Math.random() * 2) + 'px'; // random size
            document.body.appendChild(star);
        }
    </script>

    <script>
        const telemetryEl = document.getElementById('telemetry');

        async function fetchTelemetry() {
            try {
                const response = await fetch('/telemetry/latest');
                const data = await response.json();
                telemetryEl.textContent = data.telemetry;
            } catch (err) {
                telemetryEl.textContent = "Error fetching data";
            }
        }

        // Fetch immediately, then every 2 seconds
        fetchTelemetry();
        setInterval(fetchTelemetry, 2000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CubeSat Telemetry Dashboard</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        .reading { font-size: 2rem; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>CubeSat Telemetry Dashboard</h1>
    <div class="reading">
        <span id="telemetry">Loading...</span>
    </div>

    <script>
        const telemetryEl = document.getElementById('telemetry');

        async function fetchTelemetry() {
            try {
                const response = await fetch('/telemetry/latest');
                const data = await response.json();
                telemetryEl.textContent = data.telemetry;
            } catch (err) {
                telemetryEl.textContent = "Error fetching data";
            }
        }

        // Fetch immediately, then every 2 seconds
        fetchTelemetry();
        setInterval(fetchTelemetry, 2000);
    </script>
</body>
</html>
